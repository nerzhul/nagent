# ----------------------------------------------------------------------------
# Sources
# ----------------------------------------------------------------------------
# Restrict where dependencies may be pulled from. `crates-io` is
# the canonical source for Rust deps. A git or path dep is fine
# while in active development but should not ship — deny them
# here.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []