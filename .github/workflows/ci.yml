name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/stt-proto
            crates/stt-core
            crates/nagent-support
            crates/nagent-db
            crates/nagent-agents
            crates/nagent-tts
            crates/nagent-server

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Build whisper-rs without GPU features in CI: GPU toolchains are
      # not available on ubuntu-latest runners. We still compile the
      # crate to validate the source via the `cpu` feature path below.
      - name: cargo check (cpu features)
        run: |
          cargo check --workspace \
            -p stt-proto \
            -p nagent-server

      - name: cargo clippy (cpu features)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (cpu features)
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Fails the build on any known vulnerability or unmaintained warning
        # affecting the dependency tree pinned by Cargo.lock. Uses the RustSec
        # advisory database, refreshed on each run.
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check (bans / licenses / sources)
        run: |
          cargo deny check bans licenses sources

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM (cargo-cyclonedx)
        run: |
          cargo cyclonedx --format json \
            --override-filename target/sbom.cargo \
            --target-crate nagent-server

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cargo-cyclonedx
          path: target/sbom.cargo.json
          retention-days: 30
          if-no-files-found: error

  image-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the runtime image but DO NOT push it — the build
      # cache is enough for Syft to inspect the resulting image.
      # `load: true` exports it to the local Docker daemon so
      # Syft can read layers directly.
      - name: Build runtime image (cpu backend, no push)
        uses: docker/buildx-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          build-args: BACKEND=cpu
          load: true
          tags: nagent/nagent-server:sbom
          cache-from: type=gha

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json@1.5
          artifact-name: nagent-server.sbom.cdx.json
          image: nagent/nagent-server:sbom
          output-file: syft-sbom.cdx.json

      - name: Upload Syft SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-syft
          path: syft-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nagent_test
          POSTGRES_USER: nagent
          POSTGRES_PASSWORD: nagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nagent -d nagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAGENT_TEST_PG_URL: postgres://nagent:nagent@localhost:5432/nagent_test
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/stt-proto
            crates/stt-core
            crates/nagent-support
            crates/nagent-db
            crates/nagent-agents
            crates/nagent-server

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test (Postgres parity)
        # `--include-ignored` runs the parity tests in `tests.rs` that
        # are `#[ignore]`d locally. CI sets `NAGENT_TEST_PG_URL` so
        # the `pg_or_skip!` macro in `tests.rs` returns the live `Db`
        # instead of short-circuiting.
        run: cargo test -p nagent-db --lib -- --include-ignored