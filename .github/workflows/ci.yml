name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/stt-proto
            crates/stt-core
            crates/stt-server

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Build whisper-rs without GPU features in CI: GPU toolchains are
      # not available on ubuntu-latest runners. We still compile the
      # crate to validate the source via the `cpu` feature path below.
      - name: cargo check (cpu features)
        run: |
          cargo check --workspace \
            -p stt-proto \
            -p stt-server

      - name: cargo clippy (cpu features)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (cpu features)
        run: cargo test --workspace