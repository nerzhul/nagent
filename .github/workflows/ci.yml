name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/stt-proto
            crates/stt-core
            crates/nagent-support
            crates/nagent-db
            crates/nagent-agents
            crates/nagent-tts
            crates/nagent-server

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Default-features check over the whole workspace: a plain
      # `cargo check` must keep compiling, so feature-gated code cannot
      # drift out of sync with the no-feature build.
      - name: cargo check (default features, whole workspace)
        run: cargo check --workspace --all-targets

      # Widest feature set a plain ubuntu-latest runner can compile:
      # every chat agent plus the CPU whisper backend. Excluded on
      # purpose: the GPU backends (`whisper-rs-vulkan/cuda/hipblas`,
      # need Vulkan/CUDA/ROCm toolchains) and `tts` (needs espeak-ng +
      # libsonic at link time). libclang is required by whisper-rs-sys'
      # bindgen step.
      - name: Install libclang (whisper-rs-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - name: cargo check (all CI-buildable features)
        run: cargo check --workspace --all-targets --features all-agents,real-backend

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (all CI-buildable features)
        run: cargo clippy --workspace --all-targets --features all-agents,real-backend -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Fails the build on any known vulnerability or unmaintained warning
        # affecting the dependency tree pinned by Cargo.lock. Uses the RustSec
        # advisory database, refreshed on each run.
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check (bans / licenses / sources)
        run: |
          cargo deny check bans licenses sources

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM (cargo-cyclonedx)
        run: |
          cargo cyclonedx --format json \
            --override-filename target/sbom.cargo \
            --target-crate nagent-server

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cargo-cyclonedx
          path: target/sbom.cargo.json
          retention-days: 30
          if-no-files-found: error

  image-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the runtime image but DO NOT push it — the build
      # cache is enough for Syft to inspect the resulting image.
      # `--load` exports it to the local Docker daemon so Syft can
      # read layers directly.
      # NOTE: `docker/buildx-action` no longer exists upstream (the repo
      # returns 404), so drive the builder created by
      # `docker/setup-buildx-action` directly with the buildx CLI.
      - name: Build runtime image (cpu backend, no push)
        run: |
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            --file Dockerfile \
            --build-arg BACKEND=cpu \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            --tag nagent/nagent-server:sbom \
            .

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json@1.5
          artifact-name: nagent-server.sbom.cdx.json
          image: nagent/nagent-server:sbom
          output-file: syft-sbom.cdx.json

      - name: Upload Syft SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-syft
          path: syft-sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nagent_test
          POSTGRES_USER: nagent
          POSTGRES_PASSWORD: nagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nagent -d nagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAGENT_TEST_PG_URL: postgres://nagent:nagent@localhost:5432/nagent_test
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/stt-proto
            crates/stt-core
            crates/nagent-support
            crates/nagent-db
            crates/nagent-agents
            crates/nagent-server

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo test (Postgres parity)
        # `--include-ignored` runs the parity tests in `tests.rs` that
        # are `#[ignore]`d locally. CI sets `NAGENT_TEST_PG_URL` so
        # the `pg_or_skip!` macro in `tests.rs` returns the live `Db`
        # instead of short-circuiting.
        run: cargo test -p nagent-db --lib -- --include-ignored