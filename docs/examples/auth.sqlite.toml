# SQLite auth store config — drop-in for `stt-server --config
# docs/examples/auth.sqlite.toml`. Mirrors the [auth] block in
# `config.toml.example` but with a fully-populated sqlite backend
# so a fresh install can run the server out of the box.
#
# Auto-bootstrap: on first boot with an empty users table the
# server auto-creates a local admin with a random 24-char password
# and logs it at WARN level (one-time). The CLI is only needed
# for adding additional admins afterwards.

# Server knob — same shape as the main example. Tune to taste.
[server]
bind_addr = "127.0.0.1:8080"
whisper_model_path = "/models/ggml-base.bin"

# ---- Authentication ----
[auth]
enabled = true
backends = ["local"]
public_url = "http://127.0.0.1:8080"   # http://localhost auto-disables Secure cookie flag
session_ttl_days = 7                    # absolute, NOT sliding; range 1..=90
csrf_header = "x-csrf-token"

[auth.db]
backend = "sqlite"
# `sqlite:///abs/path.db?mode=rwc` for an absolute path (3 slashes =
# empty host + absolute path per the RFC). The parent directory is
# created automatically by `auth::boot::auto_bootstrap`. For
# relative paths (e.g. `./data/auth.db`) the parent must exist
# before the server starts — `make run` does this for you by
# creating `data/` on the first boot.
url = "sqlite://./data/auth.db?mode=rwc"
max_connections = 16

[auth.password]
argon2_memory_kib = 19456               # OWASP 2025 minimum; clamped to this value
argon2_iterations = 2
argon2_parallelism = 1
min_password_length = 8
allow_registration = true               # logged-in users can create accounts

# Leave [auth.oidc] / [auth.passkey] commented — a fresh install
# only needs the local backend to validate the bootstrap. Uncomment
# to enable OIDC / passkey; the server refuses to boot when the
# respective `[auth].backends` entry has missing config.
#
# [auth.oidc]
# auto_provision = true
# issuer = "https://keycloak.example.com/realms/nagent"
# client_id = "nagent"
# client_secret = ""                    # prefer env: NAGENT_AUTH_OIDC_CLIENT_SECRET
# scopes = ["openid", "email", "profile"]
# required_groups = []
# role_claim = "groups"
#
# [auth.passkey]
# self_registration = true
# rp_id = "nagent.example.com"           # MUST match the browser's effective domain
# rp_name = "nagent"
# origins = ["https://nagent.example.com"]  # scheme + port; first entry must match public_url's origin
