# Per-user credentials framework — drop-in for
# `nagent-server --config docs/examples/credentials.sqlite.toml`.
#
# Builds on `auth.sqlite.toml`: same SQLite store, same `local`
# backend, plus the AES-256-GCM credentials vault wired so the
# `/api/integrations*` routes serve the v1 framework (the
# `ServiceRegistry` ships empty — no concrete integration ships in
# v1; follow-up PRs add one `ServiceDef` per service).
#
# Per-user credentials are encrypted at rest with AES-256-GCM. The
# 32-byte key lives in plaintext inside `[auth.credentials].key`
# below. Treat this file as a secret (encrypted volume, restricted
# ACLs, no VCS). The server refuses to boot when
# `auth.enabled = true` AND `agents.enabled = true` AND
# `[auth.credentials].key` is missing or malformed.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------

[server]
bind_addr = "127.0.0.1:8080"
whisper_model_path = "/models/ggml-base.bin"

# ---------------------------------------------------------------------------
# Authentication (SQLite, single local backend)
# ---------------------------------------------------------------------------

[auth]
enabled = true
backends = ["local"]
public_url = "http://127.0.0.1:8080"   # http://localhost auto-disables Secure cookie flag
session_ttl_days = 7
csrf_header = "x-csrf-token"

[auth.db]
backend = "sqlite"
# `sqlite:///abs/path.db?mode=rwc` for an absolute path. The parent
# directory is created automatically by `auth::boot::auto_bootstrap`.
url = "sqlite://./data/auth.db?mode=rwc"
max_connections = 16

[auth.password]
argon2_memory_kib = 19456               # OWASP 2025 minimum; clamped to this value
argon2_iterations = 2
argon2_parallelism = 1
min_password_length = 8
allow_registration = true
# hash_concurrency = 0                          # argon2 ops on the blocking pool; 0 = half cores (plan R1a)

# ---------------------------------------------------------------------------
# Per-user credentials vault
# ---------------------------------------------------------------------------
# The 32-byte AES-256-GCM key lives in plaintext under
# `[auth.credentials].key`. Generate once with `openssl rand -hex 32`
# and paste the 64-char output below. The placeholder below is a
# known-bad value used so the example stays copy-paste-safe —
# replace before booting the server, otherwise the boot will fail
# with `ConfigError: invalid hex in auth.credentials.key`.
[auth.credentials]
key = "REPLACE_ME_WITH_64_HEX_CHARS_FROM_OPENSSL_RAND_HEX_32______________"

# ---------------------------------------------------------------------------
# Chat agents (master switch)
# ---------------------------------------------------------------------------
# The credentials framework only boots when at least one agent is
# registered AND auth is enabled AND the credentials key is set.
# `enabled = true` here is the default; flip it to `false` to
# disable the framework on a per-deployment basis (without touching
# the env var).
[llm]
llm_max_tool_rounds = 8

[agents]
enabled = true

# `web_fetch` is the only agent enabled by every `make run*` target.
# Add more agent sub-tables here as needed.
[agents.web_fetch]
allow_public = false
allowlist = ["*.wikipedia.org", "example.com"]
max_bytes = 2_097_152
timeout_ms = 30_000

# ---------------------------------------------------------------------------
# Boot recipe
# ---------------------------------------------------------------------------
# 1. Generate the credentials key once (do NOT reuse across clusters):
#
#        openssl rand -hex 32
#
# 2. Paste the 64-char output into `[auth.credentials].key` above.
#    Treat this file as a secret — see the warning at the top.
#
# 3. Start the server:
#
#        nagent-server --config docs/examples/credentials.sqlite.toml
#
# 4. Log in as the auto-bootstrapped admin (WARN log line on first
#    boot) and visit **Discussion → Advanced → Integrations**. The
#    v1 drawer shows "No integrations available yet" until a
#    follow-up PR adds concrete `ServiceDef` entries; the HTTP
#    surface (`GET /api/integrations`, `PUT/DELETE
#    /api/integrations/:id/credentials`) is fully wired and tested.
