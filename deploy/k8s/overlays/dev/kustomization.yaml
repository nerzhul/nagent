apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stt

resources:
  - ../../base

# Patch the service to NodePort so the dev cluster can reach the server
# without an Ingress.
patches:
  - path: service-patch.yaml
    target:
      kind: Service
      name: nagent-server

# One replica is plenty for local dev.
replicas:
  - name: nagent-server
    count: 1

# Verbose logs in dev.
configMapGenerator:
  - name: nagent-server-config
    behavior: merge
    literals:
      - RUST_LOG=debug,nagent_server=trace,stt_core=trace