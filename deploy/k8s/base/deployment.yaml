apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagent-server
spec:
  # Base uses 1 replica; overlays bump this for production.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nagent-server
      app.kubernetes.io/component: nagent-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nagent-server
        app.kubernetes.io/component: nagent-server
    spec:
      serviceAccountName: nagent-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nagent-server
          image: nagent/nagent-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nagent-server-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            # Documents cache — mounted read-write so the
            # upload handler can write the staged file before
            # the DB insert. The PVC is sized to the operator's
            # quota; the periodic sweep reclaims space.
            - name: docs-cache
              mountPath: /var/cache/nagent/docs
              readOnly: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: stt-model
        - name: docs-cache
          persistentVolumeClaim:
            claimName: nagent-docs-cache