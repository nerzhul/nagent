# Persistent volume for the ggml Whisper model.
# The model is downloaded into this PVC by a one-shot Job (see overlays)
# before the application Deployment starts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stt-model
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Storage class is intentionally omitted so the cluster default applies.
---
# Persistent volume for Discussion-mode document uploads. The server
# writes uploaded `.txt` / `.pdf` files here under a UUID-sharded
# layout (see `crates/stt-server/src/documents/storage.rs`). A
# periodic purge task (`[documents].purge_interval_hours`) reclaims
# old rows + files; a PVC gives the operator a single quota knob
# instead of an unbounded `/tmp`.
#
# Only mounted by the Deployment when `documents.enabled = true`
# in the configmap; the server refuses to boot if the feature is
# on but the dir is not writable (see
# `crates/stt-server/src/documents/storage.rs::check_writable`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nagent-docs-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Storage class is intentionally omitted so the cluster default applies.