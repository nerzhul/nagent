# Minimal RBAC for nagent-server. The server does not call the Kubernetes API
# at runtime, so this is intentionally empty; left as a placeholder so that
# overlays can add permissions (e.g. for an operator sidecar) without
# restructuring the base.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nagent-server
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nagent-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nagent-server
subjects:
  - kind: ServiceAccount
    name: nagent-server