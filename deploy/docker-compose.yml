# Local docker-compose for stt-server.
#
# Profiles:
#   - cpu          : no GPU; the in-process mock backend is used because the
#                    image built by the default Dockerfile enables
#                    `real-backend`. To exercise the mock, build with
#                    `docker build --build-arg STT_FEATURES= .` instead.
#   - gpu-vulkan   : Vulkan GPU passthrough (/dev/dri).
#   - gpu-nvidia   : NVIDIA GPU via nvidia-container-toolkit.
#   - gpu-amd      : AMD GPU via /dev/kfd and /dev/dri.
#
# Usage:
#   docker compose --profile gpu-vulkan up
#
# For the cpu profile, no model is needed; the server falls back to the
# mock backend only if the binary was built without `real-backend`.

services:
  stt-server:
    image: nagent/stt-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,stt_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  stt-server-vulkan:
    profiles: ["gpu-vulkan"]
    image: nagent/stt-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-server-vulkan
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,stt_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render

  stt-server-nvidia:
    profiles: ["gpu-nvidia"]
    image: nagent/stt-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-server-nvidia
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,stt_server=debug,stt_core=debug}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro

  stt-server-amd:
    profiles: ["gpu-amd"]
    image: nagent/stt-server:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-server-amd
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,stt_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - video
      - render