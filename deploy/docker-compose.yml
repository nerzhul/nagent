# Local docker-compose for nagent-server.
#
# Profiles:
#   - cpu          : no GPU, CPU-only real backend. The image is built with
#                    `--build-arg BACKEND=cpu`. WHISPER_MODEL_PATH still has
#                    to point at a real ggml model — there is no mock here.
#   - gpu-vulkan   : Vulkan GPU passthrough (/dev/dri). BACKEND=vulkan.
#   - gpu-nvidia   : NVIDIA GPU via nvidia-container-toolkit. BACKEND=cuda.
#   - gpu-amd      : AMD GPU via /dev/kfd and /dev/dri. BACKEND=hipblas.
#
# Usage:
#   docker compose --profile gpu-vulkan up
#
# For the cpu profile no GPU libs are needed at build or run time.
# For mock-backend iteration without a model, use `make run-mock` instead.

services:
  nagent-server:
    profiles: ["cpu"]
    image: nagent/nagent-server:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND: cpu
    container_name: nagent-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,nagent_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nagent-server-vulkan:
    profiles: ["gpu-vulkan"]
    image: nagent/nagent-server:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND: vulkan
    container_name: nagent-server-vulkan
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,nagent_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render

  nagent-server-nvidia:
    profiles: ["gpu-nvidia"]
    image: nagent/nagent-server:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND: cuda
    container_name: nagent-server-nvidia
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,nagent_server=debug,stt_core=debug}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro

  nagent-server-amd:
    profiles: ["gpu-amd"]
    image: nagent/nagent-server:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND: hipblas
    container_name: nagent-server-amd
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/models/ggml-base.bin}
      RUST_LOG: ${RUST_LOG:-info,nagent_server=debug,stt_core=debug}
    volumes:
      - ${HOST_MODEL_PATH:-./models}:/models:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - video
      - render