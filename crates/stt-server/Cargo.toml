[package]
name = "stt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WebSocket server for the STT pipeline."

[features]
# When enabled, the server uses the real whisper-rs backend; otherwise it
# falls back to an in-process mock backend (useful for tests and CI).
default = []
real-backend = ["stt-core/whisper-rs-backend"]
# `web-agent` registers the server-side `web_fetch` agent (and any
# future web-fetching tool). When off, `/v1/agents` returns an empty
# list, the LLM proxy injects no `tools` field, and `agents::web_fetch`
# is not compiled. Turned on by `make run-llm` so `make run` (CPU STT,
# no LLM) stays free of the new code path.
web-agent = []
# Daily-utility agents. Each is its own cargo feature so operators can
# pick which tools ship in their binary. All three are enabled by the
# `run*` Makefile targets (the same convention as `web-agent`). When
# off, the corresponding agent module is not compiled and the agent
# is not registered. `dep:chrono` is pulled by the three of them for
# `Utc::now()` timestamping; `chrono-tz` only by the datetime agent.
datetime-agent = ["dep:chrono", "dep:chrono-tz"]
weather-agent = ["dep:chrono"]
stock-agent = ["dep:chrono"]

[build-dependencies]
# sha2 is only used at build time to fingerprint the static frontend
# assets; the runtime itself only embeds the resulting hex string.
sha2 = "0.10"

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
toml               = { workspace = true }
bytes              = "1"
futures-util       = "0.3"
# `stream` lets us pipe `upstream.bytes_stream()` into `axum::body::Body`
# without buffering the whole response; `json` lets `/v1/models` decode
# Ollama's OpenAI-shaped payload; `rustls-tls` keeps the dep tree free of
# OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
# `chrono` powers the `datetime-agent` (`get_datetime` tool). We pull
# only the bits the agent actually uses (`clock` for `Utc::now`,
# `std` for the `SystemTime` plumbing). `wasmbind`/`serde`/`now`
# remain off to keep the dependency surface minimal.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
# `chrono-tz` brings the IANA timezone database so the datetime agent
# can resolve "Europe/Paris", "Asia/Tokyo", … without falling back to
# the system tzdata (which isn't always present on minimal Docker
# images). `default-features = false` drops the bundled tzfiles and
# keeps `chrono-tz` to its `std` plumbing.
chrono-tz = { version = "0.10", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"