[package]
name = "stt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WebSocket server for the STT pipeline."

[features]
# When enabled, the server uses the real whisper-rs backend; otherwise it
# falls back to an in-process mock backend (useful for tests and CI).
default = []
real-backend = ["stt-core/whisper-rs-backend"]

[build-dependencies]
# sha2 is only used at build time to fingerprint the static frontend
# assets; the runtime itself only embeds the resulting hex string.
sha2 = "0.10"

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
futures-util       = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"
# `json` is needed by the integration test that decodes the
# /api/version payload; `rustls-tls` keeps the dep tree free of OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }