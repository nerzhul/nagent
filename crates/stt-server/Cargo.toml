[package]
name = "stt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WebSocket server for the STT pipeline."
build = "build.rs"

[features]
# When enabled, the server uses the real whisper-rs backend; otherwise it
# falls back to an in-process mock backend (useful for tests and CI).
default = []
real-backend = ["stt-core/whisper-rs-backend"]
# `web-agent` registers the server-side `web_fetch` agent (and any
# future web-fetching tool). When off, `/v1/agents` returns an empty
# list, the LLM proxy injects no `tools` field, and `agents::web_fetch`
# is not compiled. Turned on by `make run-llm` so `make run` (CPU STT,
# no LLM) stays free of the new code path.
web-agent = []
# Daily-utility agents. Each is its own cargo feature so operators can
# pick which tools ship in their binary. All three are enabled by the
# `run*` Makefile targets (the same convention as `web-agent`). When
# off, the corresponding agent module is not compiled and the agent
# is not registered. `dep:chrono` is pulled by the three of them for
# `Utc::now()` timestamping; `chrono-tz` only by the datetime agent.
datetime-agent = ["dep:chrono-tz"]
weather-agent = []
stock-agent = []
# `calculate-agent` registers the `calculate` tool (a thin wrapper over
# `meval` with a strict deny-list on the expression grammar). Pulls
# `meval` for the AST evaluator.
calculate-agent = ["dep:meval"]
# `unit-convert-agent` registers the `unit_convert` tool (length, mass,
# volume, time, data, speed, area, plus a special-cased temperature
# conversion). Pure local, no extra deps.
unit-convert-agent = []
# `wikipedia-agent` registers the `wikipedia` tool (REST `wikipedia.org`
# summary endpoint). No API key — Wikimedia only requires a
# `User-Agent` header, which the agent sets unconditionally.
wikipedia-agent = []
# `dictionary-agent` registers the `dictionary` tool (Free Dictionary
# REST API at `api.dictionaryapi.dev`, no API key, anonymous).
# Returns definitions, phonetics, examples, and synonyms for an
# English word.
dictionary-agent = []
# `tts` pulls in `piper-rs` (and transitively `ort` + the espeak-ng
# FFI crate). With this feature off the binary compiles without
# espeak-ng / libclang / libssl-dev headers, so GPU build targets
# (`run-cuda`, `run-hipblas`, `run-vulkan`, `run-mock`) do not pay
# the heavy build cost when the operator has no intention of using
# text-to-speech. The Discussion-mode UI silently hides the
# "Read response aloud" checkbox when the feature is off.
tts = ["dep:piper-rs"]

[build-dependencies]
# sha2 is only used at build time to fingerprint the static frontend
# assets; the runtime itself only embeds the resulting hex string.
sha2 = "0.10"

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
toml               = { workspace = true }
bytes              = "1"
futures-util       = "0.3"
# `stream` lets us pipe `upstream.bytes_stream()` into `axum::body::Body`
# without buffering the whole response; `json` lets `/v1/models` decode
# Ollama's OpenAI-shaped payload; `rustls-tls` keeps the dep tree free of
# OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
# `chrono` powers the `datetime-agent` (`get_datetime` tool) AND the
# auth subsystem (RFC 3339 timestamps on session / auth_events rows).
# We pull only the bits we actually use (`clock` for `Utc::now`,
# `std` for the `SystemTime` plumbing). `wasmbind`/`serde`/`now`
# remain off to keep the dependency surface minimal.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `chrono-tz` brings the IANA timezone database so the datetime agent
# can resolve "Europe/Paris", "Asia/Tokyo", … without falling back to
# the system tzdata (which isn't always present on minimal Docker
# images). `default-features = false` drops the bundled tzfiles and
# keeps `chrono-tz` to its `std` plumbing.
chrono-tz = { version = "0.10", default-features = false, features = ["std"], optional = true }
# `piper-rs` is the Rust binding to Piper TTS (ONNX-based local
# speech synthesis). NB: on crates.io the bare name `piper` resolves
# to smol-rs's async pipe — the Piper TTS engine is published as
# `piper-rs` by thewh1teagle. Requires espeak-ng C library + headers
# on the host at build time, plus libclang and libssl-dev (transitive
# ONNX runtime deps) — see README "Text-to-Speech (Piper)" section.
#
# Gated behind the `tts` cargo feature so the GPU build targets
# (`run-cuda`, `run-hipblas`, `run-vulkan`, `run-mock`) do not have
# to pay the heavy piper-rs / ort / espeak-ng build cost when TTS
# is not in scope. The Python-LLM-only path (`make run-llm`) opts in
# via `--features stt-server/tts` because the discussion view is the
# primary TTS consumer.
piper-rs = { version = "0.2", optional = true }
# `meval` powers the `calculate-agent`. It is a small (~50 KB) safe
# expression evaluator with a documented grammar (`+ - * / ^ %`,
# parentheses, functions like `sin/cos/sqrt/log`, constants `pi`/`e`)
# and refuses unknown identifiers — exactly the safety boundary we
# need. The agent still applies its own deny-list (charset + 256-char
# cap) on top of meval's grammar so user-supplied expressions can
# never reach `eval`-style code paths.
meval = { version = "0.2", optional = true }
# `sqlx` powers the auth DB layer. The runtime is async; both
# the `sqlite` and `postgres` drivers are enabled so the operator
# picks the engine at runtime via `[auth.db].backend`. `rustls` keeps
# the dep tree free of OpenSSL (matches `reqwest`'s TLS stack);
# `chrono` + `uuid` are needed so we can store RFC 3339 timestamps
# and UUID primary keys on both engines transparently. `macros`
# is required for `sqlx::migrate!` — we use the non-macro
# `sqlx::query` (runtime-checked SQL) elsewhere so the binary
# does not need `DATABASE_URL` at build time. Always compiled in
# (no cargo feature) — auth is a core subsystem of PR1.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "macros", "migrate"] }
# `argon2` for argon2id password hashing (OWASP 2025 default params).
# Pure Rust, no system deps.
argon2 = "0.5"
# `openidconnect` for the OIDC backend. Discovery + PKCE + nonce
# validation are all built in; the crate handles the
# `end_session_endpoint` discovery for free. We pull the
# `reqwest` + `rustls-tls` features (matching the reqwest already in
# the tree — see the `reqwest = ...` dep above) and explicitly
# disable the default features to skip the bundled `color-backtrace`,
# `env_logger`, and `serde_derive` pulls. Use `oauth2`'s `reqwest`
# feature so we re-use the workspace's HTTP stack.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# `webauthn-rs` for the WebAuthn / passkey backend. The pre-release
# 0.6.x line replaced the OpenSSL dependency with `crypto-glue`,
# keeping the auth build pure-Rust (the 0.5.x line hard-pulled
# `openssl-sys`). The `attestation` feature is enabled by default in
# both lines. The `danger-allow-state-serialisation` feature is
# enabled so the passkey ceremony state can be serialised in the
# `DashMap<state_token, CeremonyEntry>` — without it the ceremony
# state cannot cross the HTTP round-trip.
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["attestation", "conditional-ui", "resident-key-support", "danger-allow-state-serialisation"] }
# `rand` is used to mint session ids, CSRF tokens, and OIDC state
# nonces (each via 32 bytes of `OsRng`). Pulled without default
# features so we only get what we actually need (`std` + `getrandom`
# via the OS RNG).
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
# `cookie` parses `Cookie:` headers and builds `Set-Cookie:` values
# for `auth/session.rs`. We don't pull `time` so cookies are emitted
# without the `Expires` attribute (the session DB row is the source
# of truth for expiry — see plan D6/D6a).
cookie = { version = "0.18", features = ["percent-encode"] }
# `hex` / `base64` are used to encode session tokens and passkey
# challenge payloads for the JSON wire format. Security plan #7
# swaps the session primary key to the SHA-256 of a 32-byte OS-RNG
# token (`sha2 = "0.10"`); the plaintext token is base64url-encoded
# before it leaves the server (cookie + JSON body).
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# `hound` writes the WAV bytes served by `POST /v1/audio/speech`.
# We emit PCM 16-bit mono at the model's declared rate (typically
# 22 050 Hz) and let the browser resample on playback. Lightweight,
# no system deps — kept unconditional so the MockSynthesizer path
# used by the HTTP integration tests works without the `tts`
# feature.
hound = "3.5"
# `tower::ServiceExt::oneshot` is used by the auth middleware
# integration tests (`auth/middleware.rs::tests`).
tower = { version = "0.5", features = ["util"] }
# `aes-gcm` powers the per-user credential vault. AES-256-GCM
# authenticated encryption with a 12-byte random nonce per secret;
# the tag is appended to the ciphertext as the aes-gcm crate does
# by default. `zeroize` + `secret` are required so the in-memory
# `Secret<[u8; 32]>` key zeroises on drop. `secrecy` (the same
# family as `zeroize`) wraps plaintext values so accidental
# `Debug`/log output cannot leak them.
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
# `pdf-extract` powers the `read_document` agent's PDF parsing. Pure
# Rust (transitively depends on `lopdf`), no system deps. The cost
# is paid unconditionally because the Documents panel is a core
# Discussion-mode feature — operators can still gate it at runtime
# via `[documents].enabled = false` in the config.
pdf-extract = "0.7"
# `mime_guess` sniffs a content-type from the file extension at upload
# time. Tiny (~10 KB), pure Rust; required by the documents routes.
mime_guess = "2"
# `ipnet` parses the `cidr` list in `[server.trusted_proxies]`
# (security plan #5). Pure Rust, ~30 KB, no system deps; lets the
# rate-limit resolver honour `X-Forwarded-For` only when the
# connection peer is in a trusted CIDR range.
ipnet = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"