[package]
name = "stt-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WebSocket server for the STT pipeline."

[features]
# When enabled, the server uses the real whisper-rs backend; otherwise it
# falls back to an in-process mock backend (useful for tests and CI).
default = []
real-backend = ["stt-core/whisper-rs-backend"]

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
futures-util       = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false }