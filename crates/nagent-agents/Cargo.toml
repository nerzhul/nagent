[package]
name = "nagent-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Server-invoked chat agents (trait, registry, service catalogue)."

[features]
# Default empty: no agent compiled in. One feature per agent so
# a slim build drops the heavy machinery. `all-agents` is the
# Makefile-target convenience.
default = []
datetime-agent = ["dep:chrono-tz"]
weather-agent = []
stock-agent = []
calculate-agent = ["dep:meval"]
unit-convert-agent = []
wikipedia-agent = []
dictionary-agent = []
web-agent = []
read-document-agent = []
caldav-agent = ["dep:icalendar", "dep:chrono-tz"]
x-agent = ["dep:oauth2"]
email-agent = ["dep:imap", "dep:imap-proto", "dep:async-smtp", "dep:mailparse", "dep:base64", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# `memory_*` chat tools. The agents only need the existing
# `secrecy` + `chrono` deps; encryption is server-side and
# the agents reach the per-user store via `MemorySource`.
memory-agent = []
# `search_tools` meta-agent + in-process BM25 router (same
# feature gates both since they boot as a pair).
tool-search-agent = []
all-agents = [
    "datetime-agent",
    "weather-agent",
    "stock-agent",
    "calculate-agent",
    "unit-convert-agent",
    "wikipedia-agent",
    "dictionary-agent",
    "web-agent",
    "read-document-agent",
    "caldav-agent",
    "x-agent",
    "email-agent",
    "memory-agent",
    "tool-search-agent",
]

[dependencies]
nagent-support = { path = "../nagent-support" }
async-trait = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
secrecy = "0.10"
# Unconditional so the `egress` module + agent files that
# mention `reqwest` in doc-tests keep compiling under any
# per-agent feature subset.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
bytes = "1"
futures-util = "0.3"
ipnet = "2"
tracing = { workspace = true }

chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = { version = "0.10", optional = true, features = ["serde"] }
meval = { version = "0.2", optional = true }
# iCalendar (RFC 5545) for VEVENT bodies.
icalendar = { version = "0.7", optional = true }
# Random hex suffix for VEVENT UIDs.
rand = { version = "0.8", default-features = false, features = ["std", "getrandom", "std_rng"] }
# Base64 for the HTTP Basic Authorization header.
base64 = { version = "0.23", optional = true }
# OAuth2 PKCE dance (catalogue candidate #2). `reqwest` backend
# so the agent's shared `reqwest::Client` is reused via
# `request_async(&self.http)`.
oauth2 = { version = "5", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }

# IMAP + SMTP wire clients. `imap` is synchronous so every call
# goes through `tokio::task::spawn_blocking`. The SMTP wire client
# wraps the rustls TLS stream itself (`async-smtp` does not do
# STARTTLS), so we pull `rustls` + `tokio-rustls` + `webpki-roots`.
imap = { version = "2.4", optional = true, default-features = false }
imap-proto = { version = "0.10", optional = true }
async-smtp = { version = "0.10", optional = true, default-features = false, features = ["runtime-tokio"] }
mailparse = { version = "0.18", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["logging", "tls12"] }
webpki-roots = { version = "1", optional = true }