[package]
name = "nagent-support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared building blocks (sweep clock, TTL map, bounded blocking helper)."

[dependencies]
tokio = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
# The `egress` module owns the hardened HTTP egress client; it is
# shared by `nagent-shortcut` and `nagent-agents` alike.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
bytes = "1"
futures-util = "0.3"
