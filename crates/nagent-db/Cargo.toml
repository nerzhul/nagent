[package]
name = "nagent-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Per-domain repositories over a shared sqlx pool (sqlite + postgres)."

[features]
default = ["db-sqlite", "db-postgres"]
# Markers forwarded by `nagent-server` so an operator can build
# with only one engine enabled. Per-domain `use sqlx::{Row, …}`
# paths stay unconditional, so a true slim build would need every
# per-domain `use` rewritten behind `cfg(feature = …)`. We keep
# the markers but flag the limitation; `AnyPool` variants and
# per-domain `match` arms are `#[cfg]`-gated.
db-sqlite = []
db-postgres = []
# Integration-test escape hatches (`Db::raw_insert_one_str` etc.).
# Off by default and reachable only via a dev-dependency, so a
# production binary cannot call them at the type level.
test-util = []

[dependencies]
nagent-support = { path = "../nagent-support" }
async-trait = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Both drivers are always linked; `AnyPool` is per-driver via
# `cfg`, so the cost is one libpq / libsqlite pair rather than
# the full PostgreSQL client. See `db-sqlite` / `db-postgres`
# features above for the slim-build limitation.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "macros", "migrate"] }

[dev-dependencies]
nagent-db = { path = ".", features = ["test-util"] }
