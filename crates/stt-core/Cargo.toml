[package]
name = "stt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Whisper backend abstraction, inference worker and queue."

[features]
# Off by default so CI on a plain ubuntu-latest runner can build
# the workspace using only the mock backend.
default = []
# Always required, even when a GPU backend is added, so `make run`
# works out of the box with no system deps.
whisper-rs-backend = ["dep:whisper-rs"]
# Pick at most one — enabling several wastes build time and
# fights over system libraries (libvulkan + CUDA driver headers).
whisper-rs-vulkan  = ["whisper-rs-backend", "whisper-rs/vulkan"]
whisper-rs-cuda    = ["whisper-rs-backend", "whisper-rs/cuda"]
whisper-rs-hipblas = ["whisper-rs-backend", "whisper-rs/hipblas"]

[dependencies]
stt-proto   = { path = "../stt-proto" }
tokio       = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
whisper-rs  = { workspace = true, optional = true }