[package]
name = "nagent-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Local Piper ONNX text-to-speech engine, isolated behind a small trait so the inference split (plan H) can move it to a separate tier later."

[features]
# Piper ONNX backend; off → MockSynthesizer is the only available
# backend. Mirrors the `[tts]` feature gate on `nagent-server` so
# the GPU build targets (`make run-cuda`, `make run-hipblas`) opt
# out and avoid pulling espeak-ng / libclang / libssl-dev.
tts = ["dep:piper-rs"]

[dependencies]
nagent-support = { path = "../nagent-support" }
hound = "3.5"
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
piper-rs = { version = "0.2", optional = true }

[dev-dependencies]
# Unit tests exercise `MockSynthesizer` only; no need for the
# piper-rs build deps.