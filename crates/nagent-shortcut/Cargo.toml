[package]
name = "nagent-shortcut"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Pure Shortcut REST API v3 client shared by the chat agents and the server dashboard endpoints."

[dependencies]
nagent-support = { path = "../nagent-support" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
uuid = { workspace = true }
secrecy = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
