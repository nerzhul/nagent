<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nagent</title>
  <link rel="stylesheet" href="/static/style.css">
  <!--
    The `@ricky0123/vad-web` package ships only a UMD bundle (no ESM
    "module" field in its package.json), so we load it via a regular
    <script> tag. It depends on onnxruntime-web being present as the
    `window.ort` global, so ORT must come first.

    Both bundles are vendored under `static/vendor/` rather than fetched
    from a CDN at runtime. The CDN approach hit two problems that are
    impossible to work around without a bundler:
      - jsdelivr does not serve `ort-wasm-simd-threaded.mjs` (returns
        a 404 with `Content-Type: text/plain`, which `nosniff` blocks
        from being imported as a module).
      - Even when the ORT worker is disabled, the VAD model and WASM
        files still have to be served from the same origin to avoid
        CORS gymnastics with the AudioWorklet and the worker URL.
  -->
  <script src="/static/vendor/ort/ort.min.js"></script>
  <script src="/static/vendor/vad/bundle.min.js"></script>
  <!--
    Markdown rendering for Discussion-mode assistant bubbles.
    Vendored locally for the same reason as the VAD/ORT bundles: the
    server has no build step, no bundler, and no npm install at runtime,
    so we cannot rely on a CDN to satisfy a strict CSP / offline setup.
    `marked` parses the accumulated LLM stream into HTML and `DOMPurify`
    sanitizes the result so a prompt-injection reply can't smuggle
    `<script>` tags or `onerror=` handlers into the chat bubble.
    Both libraries expose globals (`window.marked`, `window.DOMPurify`)
    and are loaded as classic scripts before the chat.js module.
  -->
  <script src="/static/vendor/marked/marked.min.js"></script>
  <script src="/static/vendor/sanitize/purify.min.js"></script>
  <!--
    Math rendering for Discussion-mode assistant bubbles. The chat model
    frequently emits LaTeX (`\frac{a}{b}`, `\sqrt{x}`, `\int`, sums,
    Greek letters) that marked passes through as plain text; without
    KaTeX the user sees the raw `\frac{5000W}{500W}` source instead of
    a stacked fraction. KaTeX is loaded as classic scripts before
    chat.js, and `auto-render` exposes a `renderMathInElement(root)`
    helper that we call on every assistant bubble after marked has
    produced HTML. Fonts are vendored under `vendor/katex/fonts/` and
    referenced by relative paths from `katex.min.css`; the static
    handler serves them with `font/woff2` (see `static_assets.rs`).
  -->
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <script src="/static/vendor/katex/katex.min.js" defer></script>
  <script src="/static/vendor/katex/contrib/auto-render.min.js" defer></script>
</head>
<body>
  <!--
    Login modal: lives in the body (not in the app template) so it
    can be shown before the app shell is mounted. `auth.js` is
    loaded directly at the bottom of the body and probes `/api/me`
    before deciding whether to clone the app template (showing the
    UI) or open this modal (hiding the UI entirely from the DOM
    until the user authenticates).
  -->
  <dialog id="login-modal" class="login-modal" aria-labelledby="login-modal-title">
    <form id="login-form" method="dialog">
      <h2 id="login-modal-title">Sign in</h2>
      <label>
        Login
        <input type="email" name="email" id="login-email" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" name="password" id="login-password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <div class="login-modal-actions">
        <button type="button" id="login-cancel" class="login-cancel">Cancel</button>
        <button type="submit" id="login-submit" class="login-submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <!--
    Mount point for the app shell. `auth.js` clones
    `#app-shell-template` into this container after a successful
    `/api/me` probe. While the container is empty, the entire UI
    is genuinely absent from the DOM (DevTools shows nothing) so
    anonymous users on an auth-enabled server cannot inspect or
    interact with the chat/voice controls.
  -->
  <div id="app-root"></div>

  <template id="app-shell-template">
  <header>
    <h1>nagent</h1>
    <p class="subtitle">Local Whisper transcription and local-model chat.</p>
    <p class="version-line">
      <span>backend <code id="backend-version">…</code></span>
      <span>frontend <code id="frontend-version-self">…</code></span>
    </p>

    <!-- Auth pill: shows "Logged in as <email>" when authenticated,
         a "Sign in" link when not. Hidden entirely when the
         runtime config sets `auth.enabled = false` (the `/api/me`
         probe returns 404, see `auth.js`). -->
    <div id="auth-pill" class="auth-pill" hidden>
      <span id="auth-pill-text">…</span>
      <button id="auth-pill-action" type="button" class="auth-pill-action" hidden></button>
      <button id="auth-pill-logout" type="button" class="auth-pill-action" hidden>Sign out</button>
    </div>

    <nav id="mode-toggle" role="tablist" aria-label="Mode">
      <button role="tab" id="mode-transcript-btn" aria-selected="true"
              data-mode="transcript">Transcript</button>
      <button role="tab" id="mode-discussion-btn" aria-selected="false"
              data-mode="discussion">Discussion</button>
    </nav>
  </header>

  <main id="view-transcript" class="view" data-active="true">
    <!-- Transcript-mode voice oscilloscope. Mounted at the top of the
         Transcript view per docs/ui_features.md §1.3. Each mode owns
         its own instance of the widget; only the DOM anchor differs.
         Hidden by default; AudioCapture._setGraphVisible toggles
         `.is-hidden` when recording starts/stops. -->
    <section class="voice-graph is-hidden" id="voice-graph-transcript"
             aria-label="Live microphone waveform">
      <div class="voice-graph-header">
        <span class="voice-graph-label">Live input</span>
        <span id="voice-graph-transcript-level" class="voice-graph-level"
              title="Speech probability">
          <span class="bar"></span>
        </span>
      </div>
      <canvas id="voice-graph-transcript-canvas"></canvas>
    </section>

    <div id="update-banner" class="update-banner" role="status" aria-live="polite" hidden>
      <span class="update-banner-text">
        A new version of the UI is available.
      </span>
      <button id="update-banner-reload" type="button">Reload</button>
      <button id="update-banner-dismiss" type="button" class="ghost">Dismiss</button>
    </div>

    <section class="controls">
      <button id="record-btn" type="button" data-state="idle">Record</button>
      <label>
        Language
        <select id="lang-select">
          <option value="">Auto-detect</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="translate-check"> Translate to English
      </label>
      <label>
        <input type="checkbox" id="inactivity-check" checked>
        Auto-stop after 5s of silence
      </label>
      <button id="download-btn" type="button" disabled hidden>Download .txt</button>
      <!--
        Export dropdown. A `<details>` element acts as a lightweight
        popover: clicking the summary opens the menu, picking an item
        triggers the matching exporter and collapses the menu. Hidden
        until the first transcript line lands (same `disabled`
        contract as the legacy `Download .txt` button).
      -->
      <details id="download-menu" class="download-menu" disabled>
        <summary class="download-menu-summary">Download ▾</summary>
        <ul class="download-menu-list" role="menu">
          <li role="menuitem"><a href="#" data-format="txt">Plain text (.txt)</a></li>
          <li role="menuitem"><a href="#" data-format="srt">SubRip (.srt)</a></li>
          <li role="menuitem"><a href="#" data-format="vtt">WebVTT (.vtt)</a></li>
          <li role="menuitem"><a href="#" data-format="json">JSON (.json)</a></li>
        </ul>
      </details>
      <button id="clear-btn" type="button" class="ghost" disabled>Clear</button>
      <span id="status" class="status idle">idle</span>
      <span id="backend-info" class="backend-info"></span>
    </section>

    <section class="transcript">
      <ol id="transcript-list" aria-live="polite"></ol>
    </section>
  </main>

  <main id="view-discussion" class="view" hidden>
    <aside class="chat-sidebar" aria-label="Chat sessions">
      <button id="chat-new-session" type="button" class="chat-new-session">
        <span class="chat-new-session-icon" aria-hidden="true">+</span>
        <span>New chat</span>
      </button>
      <ul id="chat-sessions" class="chat-sessions" role="list"></ul>
      <!--
        Documents panel. Lives inside the chat sidebar so the
        Discussion-mode layout stays a 2-column shell (sidebar +
        chat). The panel itself is a sibling <details> so it
        collapses by default and does not eat vertical space when
        the user has not uploaded anything yet. `documents.js`
        owns the panel behaviour; it is a no-op when the server
        reports documents disabled (the `<details>` still ships
        in the template so the build is identical across
        configurations).
      -->
      <details id="documents-panel" class="documents-panel">
        <summary class="documents-panel-summary">
          <span>Documents</span>
          <button id="documents-upload-btn" type="button"
                  class="documents-upload-btn" aria-label="Upload document">+</button>
          <input id="documents-upload-input" type="file"
                 accept=".pdf,.txt,.md,.log" hidden multiple>
        </summary>
        <ul id="documents-list" class="documents-list" role="list"></ul>
        <p id="documents-empty" class="documents-empty">
          Drag a PDF or text file here, or paste one.
        </p>
      </details>
    </aside>
    <div class="chat-main">
    <header class="chat-header">
      <h2>Assistant</h2>
      <label class="chat-model">
        <span>Model</span>
        <select id="chat-model"></select>
      </label>
      <!--
        Geolocation opt-in. Hidden until the user has granted browser
        permission AND cached a position. Pre-grant, the entry point
        is the `📍 Share location` button below in the form footer;
        once enabled, this becomes a status pill that opens the
        Advanced panel on click.
      -->
      <button id="chat-location-pill" type="button" class="chat-location-pill"
              hidden
              title="Open Advanced to manage your shared location">
        <span class="chat-location-pill-icon" aria-hidden="true">📍</span>
        <span id="chat-location-pill-text">…</span>
      </button>
      <button id="chat-clear" type="button" class="ghost">Clear</button>
      <span id="chat-status" class="status idle">idle</span>
    </header>

    <section class="chat-audio">
      <label>
        <span class="chat-audio-label">Language</span>
        <select id="chat-lang-select">
          <option value="">Auto-detect</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="chat-translate-check"> Translate to English
      </label>
      <!--
        Read-aloud toggle. Hidden when the server reports TTS disabled
        (chat.js does the visibility check on boot). Toggling it lazily
        creates the AudioContext so we satisfy the browser's autoplay
        policy (a user-gesture handler is required).
      -->
      <label id="chat-tts-label" hidden>
        <input type="checkbox" id="chat-tts-check"> Read response aloud
      </label>
      <span id="chat-backend-info" class="backend-info"></span>
    </section>

    <div id="chat-messages" class="chat-messages" aria-live="polite">
      <!-- Discussion-mode voice oscilloscope, mounted inline as a
           voice bubble at the *end* of `#chat-messages` per
           docs/ui_features.md §4.10 ("DOM anchor: a dedicated
           voice-bubble element appended to `#chat-messages`").
           Same shared widget code as the Transcript-mode instance
           (createScope + AudioCapture); only the DOM anchor and
           CSS placement differ. Hidden by default;
           `AudioCapture._setGraphVisible` toggles `.is-hidden`.
           The `.voice-graph--inline` modifier opts out of the
           flex layout's gap so a hidden bubble does not leave a
           phantom 0.75rem below the last visible message, and
           gives the bubble a darker background + accent-coloured
           left border so it stands out from the chat-messages
           container (whose `--bg-elev` background is identical
           to the base voice-graph background; without the
           override the bubble blended into its parent). -->
      <section class="voice-graph voice-graph--inline is-hidden"
               id="voice-graph-discussion"
               aria-label="Live microphone waveform">
        <div class="voice-graph-header">
          <span class="voice-graph-label">Live input</span>
          <span id="voice-graph-discussion-level" class="voice-graph-level"
                title="Speech probability">
            <span class="bar"></span>
          </span>
        </div>
        <canvas id="voice-graph-discussion-canvas"></canvas>
      </section>
    </div>
    <details class="chat-advanced">
      <summary>Advanced</summary>
      <!--
        TTS sub-panel, folded into the main Advanced disclosure
        instead of having its own nested `<details>`. Hidden when
        `#chat-tts-check` is off (chat.js toggles the `[hidden]`
        attribute). The voice selectors are populated dynamically
        from `GET /v1/audio/voices` on boot so the user only ever
        sees voices that are actually installed in `TTS_MODEL_DIR`.
      -->
      <div id="chat-tts-settings" class="chat-tts-settings" hidden>
        <h4 class="chat-tts-settings-title">Text-to-Speech</h4>
        <label class="chat-tts-voice-label">
          English voice
          <select id="chat-tts-voice-en"></select>
        </label>
        <label class="chat-tts-voice-label">
          French voice
          <select id="chat-tts-voice-fr"></select>
        </label>
        <!--
          Speed slider. Piper `length_scale` is INVERTED from human
          intuition: `>1.0` = SLOWER, `<1.0` = FASTER. We label the
          slider 0.5x…1.5x so the direction is unambiguous (smaller
          value = faster). The actual `length_scale` sent to Piper
          is the inverse mapping, computed in chat.js.
        -->
        <label class="chat-tts-speed-label">
          Speed
          <input id="chat-tts-speed" type="range" min="0.5" max="1.5"
                 step="0.05" value="1.0">
          <span id="chat-tts-speed-display">1.0x</span>
        </label>
        <label>
          <input type="checkbox" id="chat-tts-autoplay" checked>
          Auto-play next response
        </label>
        <label>
          <input type="checkbox" id="chat-tts-stop-on-send" checked>
          Stop on new message
        </label>
        <!--
          `Test voice` button. Clicking synthesises a fixed sample
          phrase and plays it through the same Web Audio queue the
          LLM replies use, without involving the LLM proxy. Useful
          for validating the voice and audio path without sending a
          message.
        -->
        <button id="chat-tts-test" type="button" class="ghost">
          Test voice
        </button>
      </div>
      <p id="chat-agents-banner" class="chat-agents-banner" hidden>
        Agents available: <strong id="chat-agents-banner-names"></strong>
        — ask the model to fetch a URL.
      </p>
      <label class="chat-system-label">
        Additional instructions
        <textarea id="chat-system" rows="2"
                  placeholder="Optional. Appended to the server's default system prompt."></textarea>
      </label>
      <label class="chat-temperature-label">
        Temperature
        <input id="chat-temperature" type="number" min="0"
               max="2" step="0.1" value="0.8">
      </label>
      <!--
        Geolocation controls. Hidden until a position has been cached
        in `localStorage`; the initial opt-in is the
        `#chat-location-share` button in the form footer. The status
        text + manual refresh / forget buttons live here so the user
        can re-audit the choice without leaving Advanced.
      -->
      <div id="chat-location-advanced" class="chat-location-advanced" hidden>
        <label class="chat-location-toggle-label">
          <input id="chat-location-toggle" type="checkbox">
          Include my location in LLM context
        </label>
        <div class="chat-location-actions">
          <button id="chat-location-refresh" type="button" class="ghost">
            Refresh my location
          </button>
          <button id="chat-location-forget" type="button" class="ghost">
            Forget my location
          </button>
        </div>
        <p id="chat-location-status" class="chat-location-status">…</p>
      </div>
      <!--
        Browser timezone opt-in. Always available (unlike location,
        which requires HTTPS + a cached fix), so it lives at the top
        level of Advanced rather than being gated behind a cache check.
        The status line surfaces the detected IANA name so the user can
        spot a wrong value (e.g. a VPN tunneling into a different
        region) before they trust the LLM's clock to be theirs.
      -->
      <div class="chat-timezone-advanced">
        <label class="chat-timezone-toggle-label">
          <input id="chat-timezone-toggle" type="checkbox">
          Use browser timezone in LLM context
        </label>
        <p id="chat-timezone-status" class="chat-timezone-status">…</p>
      </div>
      <!--
        Reply-language picker. Decoupled from the chat-audio header
        `#chat-lang-select` (which is the STT *input* language — Whisper
        transcription). The picker here drives two things: the LLM
        reply language (server-side system-block injection, gated by
        `LLM_ALLOW_USER_REPLY_LANGUAGE`) and the TTS voice choice
        (`chat.js::resolveTtsVoice` reads from this preference, not from
        the STT picker). "Auto" maps to a wire-level `null` so the LLM
        falls back to "match the user's input language"; any non-`""`
        value is sent as a JSON string. List mirrors
        `#chat-lang-select` so users see the same codes in both
        pickers.
      -->
      <label class="chat-reply-language-label">
        <span>Reply language</span>
        <select id="chat-reply-language">
          <option value="">Auto (user input)</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <!--
        Per-user credentials drawer. Hidden until `chat.js` boots
        and confirms the user is authenticated (the routes require
        `RequireAuth` so an anonymous GET would 401 and the section
        would stay empty). Each row is one service; the status pill
        and the Configure / Edit button live next to the service
        icon + name. The form modal is rendered by
        `static/integrations.js`; the form here is the placeholder
        before JS hydrates.
      -->
      <details id="chat-integrations" class="chat-integrations" hidden>
        <summary>Integrations</summary>
        <ul id="chat-integrations-list" class="chat-integrations-list">
          <li class="chat-integrations-empty">
            No integrations available yet.
          </li>
        </ul>
      </details>
    </details>
    <form id="chat-form">
      <textarea id="chat-input" rows="1"
                placeholder="Message… (Enter to send, Ctrl+Enter for newline, Ctrl+Shift+D to talk)"
                title="Enter sends the message. Ctrl+Enter or Shift+Enter inserts a newline. Ctrl+Shift+D toggles voice recording."
                autocomplete="off"></textarea>
      <!--
        Initial opt-in for sharing location. Hidden once a position has
        been cached; the header pill (#chat-location-pill) and the
        advanced controls take over from there. Hidden outright when
        `window.isSecureContext === false` (e.g. plain-HTTP LAN
        deploy) because `navigator.geolocation` would reject the
        call — better to grey the button out with a tooltip than to
        look broken.
      -->
      <button id="chat-location-share" type="button"
              class="chat-location-share" title="Share your approximate location with the LLM">
        <span aria-hidden="true">📍</span>
        <span>Share location</span>
      </button>
      <button id="chat-record-btn" type="button" data-state="idle"
              aria-label="Start voice recording (Ctrl+Shift+D)"
              title="Start voice recording (Ctrl+Shift+D)">
        <svg class="chat-record-icon-mic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z" fill="currentColor"/>
          <path d="M17 11a5 5 0 0 1-10 0H5.5a6.5 6.5 0 0 0 5.75 6.46V20h-3a.75.75 0 0 0 0 1.5h7.5a.75.75 0 0 0 0-1.5h-3v-2.54A6.5 6.5 0 0 0 18.5 11H17z" fill="currentColor"/>
        </svg>
        <svg class="chat-record-icon-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
        </svg>
      </button>
      <button id="chat-send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3.4 20.4l17.5-7.5a.5.5 0 0 0 0-.92L3.4 4.6a.5.5 0 0 0-.7.6L4.8 11l10.2 1a.5.5 0 0 1 0 .99L4.8 14l-2.1 5.8a.5.5 0 0 0 .7.6z"
                fill="currentColor"/>
        </svg>
      </button>
      <button id="chat-stop" type="button" hidden aria-label="Stop generating">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
    </form>
    <p id="chat-disabled-notice" class="chat-disabled-notice" hidden>
      Chat disabled on this server.
    </p>
    </div>
  </main>

  <!-- Mode toggle is a plain script (no imports) so it can run as a
       classic non-module script. chat.js is a module so we can use
       top-level await + scoped imports cleanly. Both are independent
       of the UMD globals above. -->
  <script src="/static/mode.js" defer></script>
  <script type="module" src="/static/chat.js"></script>
  <script type="module" src="/static/app.js"></script>

  <!--
    Keyboard shortcuts help modal. Hidden until the user presses
    `?` (or clicks a future header help button). The list mirrors
    `crates/stt-server/src/static/shortcuts.js`; both must move
    together when a new shortcut lands.

    The `<kbd class="shortcuts-modal-mod">Ctrl</kbd>` markers are
    rewritten on macOS-like platforms by `rewriteMacModifiers()`
    into the ⌘ glyph, so the rest of the markup stays static.
  -->
  <div id="shortcuts-modal" class="shortcuts-modal" role="dialog"
       aria-modal="true" aria-labelledby="shortcuts-modal-title"
       aria-hidden="true" hidden>
    <div class="shortcuts-modal-card" role="document">
      <header class="shortcuts-modal-header">
        <h2 id="shortcuts-modal-title">Keyboard shortcuts</h2>
        <button id="shortcuts-modal-close" type="button"
                class="shortcuts-modal-close"
                aria-label="Close shortcuts help">×</button>
      </header>
      <div class="shortcuts-modal-body">
        <p class="shortcuts-modal-intro">
          Press <kbd>?</kbd> any time to open this list.
          <kbd>Esc</kbd> closes it.
        </p>
        <h3>Global</h3>
        <dl class="shortcuts-modal-list">
          <dt><kbd>?</kbd></dt>
          <dd>Open this help</dd>
          <dt><kbd>Esc</kbd></dt>
          <dd>Close this help, or stop an in-flight chat reply</dd>
          <dt><kbd class="shortcuts-modal-mod">Ctrl</kbd>+<kbd>S</kbd></dt>
          <dd>Export the current transcript as <code>.txt</code></dd>
        </dl>
        <h3>Transcript mode</h3>
        <dl class="shortcuts-modal-list">
          <dt><kbd class="shortcuts-modal-mod">Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd></dt>
          <dd>Toggle recording</dd>
        </dl>
        <h3>Discussion mode</h3>
        <dl class="shortcuts-modal-list">
          <dt><kbd>Enter</kbd></dt>
          <dd>Send the current message</dd>
          <dt><kbd class="shortcuts-modal-mod">Ctrl</kbd>+<kbd>Enter</kbd> / <kbd>Shift</kbd>+<kbd>Enter</kbd></dt>
          <dd>Insert a newline in the message</dd>
          <dt><kbd class="shortcuts-modal-mod">Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></dt>
          <dd>Toggle voice recording</dd>
          <dt><kbd>Esc</kbd></dt>
          <dd>Stop an in-flight reply</dd>
        </dl>
      </div>
    </div>
  </div>
  <script type="module" src="/static/shortcuts.js"></script>
  </template>

  <!--
    `auth.js` is the only script that lives outside the app-shell
    template. It owns the initial `/api/me` probe, the login
    form, and the mount/unmount lifecycle of the template above.
    It is the only thing that can show the login modal before the
    rest of the UI exists in the DOM.
  -->
  <script type="module" src="/static/auth.js"></script>
  <!--
    Per-user integrations UI. Loaded after `auth.js` so the
    `onAuthStateChanged` callback the module installs can fire on
    the initial auth check (otherwise the section would only render
    after the next login / logout). The module is a no-op when
    `auth.enabled` is false so dev builds do not see a dead "No
    integrations available yet" pill.
  -->
  <script type="module" src="/static/integrations.js"></script>
  <!--
    Per-user preferences sync (location / timezone opt-ins).
    Loaded before `chat.js` so `acquireCurrentPreferenceFlags` is
    available when the chat's toggle handlers fire; the actual
    server-side `loadFromServer` call happens once at chat boot
    (after `auth.js` has confirmed a session exists).
  -->
  <script type="module" src="/static/preferences.js"></script>
  <!--
    Documents panel. Loaded as a module so `chat.js` can import
    the same `setSessionId` / `refresh` helpers it calls on
    session switch. The module is a no-op when the server
    reports documents disabled (the panel stays in the DOM but
    shows no rows).
  -->
  <script type="module" src="/static/documents.js"></script>
</body>
</html>
