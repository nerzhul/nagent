[package]
name = "nagent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum HTTP/WebSocket server for the nagent pipeline."
build = "build.rs"

[features]
default = []
# Real whisper-rs backend; off → in-process mock (tests, CI).
real-backend = ["stt-core/whisper-rs-backend"]
# Per-agent gates; off → module not compiled, agent not registered.
web-agent = []
datetime-agent = ["dep:chrono-tz"]
weather-agent = []
stock-agent = []
calculate-agent = ["dep:meval"]
unit-convert-agent = []
wikipedia-agent = []
dictionary-agent = []
# Piper TTS; pulls piper-rs + ort + espeak-ng FFI.
tts = ["dep:piper-rs"]
# Integration-test AppState builder (crate::testing).
test-util = []

[build-dependencies]
# Fingerprints the static frontend assets at build time.
sha2 = "0.10"

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
nagent-support     = { path = "../nagent-support" }
nagent-db          = { path = "../nagent-db" }
nagent-agents      = { path = "../nagent-agents" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
toml               = { workspace = true }
bytes              = "1"
futures-util       = "0.3"
# stream = SSE pipe-through; json = /v1/models decoder; rustls-tls = no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
# `clock`/`std` only; wasmbind/serde/now stay off to keep the surface minimal.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA tz database (datetime agent); drops bundled tzfiles.
chrono-tz = { version = "0.10", default-features = false, features = ["std"], optional = true }
# ONNX-based Piper TTS. Requires espeak-ng C library + headers + libclang + libssl-dev on the host.
piper-rs = { version = "0.2", optional = true }
# Sandboxed expression evaluator for the calculate tool.
meval = { version = "0.2", optional = true }
argon2 = "0.5"
# Reuses the workspace's reqwest + rustls TLS stack.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# 0.6.x replaces openssl-sys with crypto-glue (pure-Rust build).
# danger-allow-state-serialisation lets the ceremony state cross the HTTP round-trip.
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["attestation", "conditional-ui", "resident-key-support", "danger-allow-state-serialisation"] }
# OS-RNG for session ids, CSRF tokens, OIDC nonces.
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
# We drop `time` — session expiry lives in the DB row, not the cookie.
cookie = { version = "0.18", features = ["percent-encode"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# WAV encoder for /v1/audio/speech. Always on so MockSynthesizer works without the `tts` feature.
hound = "3.5"
tower = { version = "0.5", features = ["util"] }
# AES-256-GCM vault; zeroize + secrecy keep plaintext out of Debug/logs.
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
# PDF parsing for read_document; runtime-gated by `[documents].enabled`.
pdf-extract = "0.7"
mime_guess = "2"
# Trusted-proxy CIDR parser for security plan #5.
ipnet = "2"

[dev-dependencies]
# `test-util` enables the `crate::testing::app_state` builder that
# the integration tests import. Listed here so `cargo test` builds
# the module without requiring `--features test-util` on the
# command line.
nagent-server = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"
# Plan 4.A follow-up: tests now reach raw SQL through
# `nagent_db::Db::raw_execute` / `raw_query_scalar_i64` /
# `raw_query_text_vec` / `raw_query_one_pair` /
# `raw_insert_one_str`, so the dev-dep on `sqlx` is no longer
# required and the integration tests are fully nagent_db-driven.