[package]
name = "nagent-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "axum HTTP/WebSocket server for the nagent pipeline."
build = "build.rs"

[features]
default = []
# Real whisper-rs backend; off → in-process mock (tests, CI).
real-backend = ["stt-core/whisper-rs-backend"]
# Per-agent gates; off → module not compiled, agent not registered.
# Forwarded 1:1 to `nagent-agents` so the operator toggles the
# agent on the server crate only.
web-agent = ["nagent-agents/web-agent"]
datetime-agent = ["nagent-agents/datetime-agent", "dep:chrono-tz"]
weather-agent = ["nagent-agents/weather-agent"]
stock-agent = ["nagent-agents/stock-agent"]
calculate-agent = ["nagent-agents/calculate-agent", "dep:meval"]
unit-convert-agent = ["nagent-agents/unit-convert-agent"]
wikipedia-agent = ["nagent-agents/wikipedia-agent"]
dictionary-agent = ["nagent-agents/dictionary-agent"]
read-document-agent = ["nagent-agents/read-document-agent"]
caldav-agent = ["nagent-agents/caldav-agent"]
x-agent = ["nagent-agents/x-agent"]
email-agent = ["nagent-agents/email-agent"]
# `search_tools` meta-agent + BM25 router. Always compiled in
# alongside `all-agents` so every target that dispatches tools
# has the discovery surface.
tool-search-agent = ["nagent-agents/tool-search-agent"]
# Convenience meta-feature: every agent compiled in. Cargo's
# feature forwarding only enables the agents in the agents crate
# (`AgentDescriptor` table); the matching server-side gates
# (`app.rs` ServiceRegistry swap, `credentials/caldav_probe.rs`,
# per-agent config forwarding) must be listed here too —
# otherwise `make run-hipblas` builds with agents compiled but
# server-side wiring silently degrading to the no-feature default.
all-agents = [
    "nagent-agents/all-agents",
    "datetime-agent",
    "weather-agent",
    "stock-agent",
    "calculate-agent",
    "unit-convert-agent",
    "wikipedia-agent",
    "dictionary-agent",
    "web-agent",
    "read-document-agent",
    "caldav-agent",
    "x-agent",
    "email-agent",
    "tool-search-agent",
]
# Piper TTS; pulls piper-rs + ort + espeak-ng FFI through
# `nagent-tts` so the engine can be split into its own
# inference tier later.
tts = ["nagent-tts/tts"]
# Integration-test AppState builder (crate::testing).
test-util = []

[build-dependencies]
sha2 = "0.10"

[dependencies]
stt-proto          = { path = "../stt-proto" }
stt-core           = { path = "../stt-core" }
nagent-support     = { path = "../nagent-support" }
nagent-db          = { path = "../nagent-db" }
nagent-agents      = { path = "../nagent-agents" }
nagent-tts         = { path = "../nagent-tts" }
axum               = { workspace = true }
tokio              = { workspace = true }
tower-http         = { workspace = true }
dashmap            = { workspace = true }
uuid               = { workspace = true }
rust-embed         = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
postcard           = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy            = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
async-trait        = { workspace = true }
toml               = { workspace = true }
bytes              = "1"
futures-util       = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA tz database (datetime agent); drops bundled tzfiles.
chrono-tz = { version = "0.10", default-features = false, features = ["std"], optional = true }
# ONNX-based Piper TTS moved to `nagent-tts`; the server only
# consumes the engine through that crate.
meval = { version = "0.2", optional = true }
argon2 = "0.5"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# Pinned to `=0.6.1-dev` so a future dev-build cannot slip in
# via semver-compatible ranges; `cargo-deny` mirrors the
# constraint. `danger-allow-state-serialisation` lets the
# ceremony state cross the HTTP round-trip.
webauthn-rs = { version = "=0.6.1-dev", default-features = false, features = ["attestation", "conditional-ui", "resident-key-support", "danger-allow-state-serialisation"] }
# OS-RNG for session ids, CSRF tokens, OIDC nonces.
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
# We drop `time` — session expiry lives in the DB row, not the cookie.
cookie = { version = "0.18", features = ["percent-encode"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# WAV encoder for /v1/audio/speech. Always on so MockSynthesizer
# works without the `tts` feature.
hound = "3.5"
tower = { version = "0.5", features = ["util"] }
# AES-256-GCM vault; zeroize + secrecy keep plaintext out of Debug/logs.
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
# PDF parsing for read_document; runtime-gated by `[documents].enabled`.
# Per-page text extraction goes through `pdf_extract::output_doc_page`
# (NOT `lopdf::Document::extract_text`): the latter uses lopdf 0.34's
# bundled CMap parser, which raises `ToUnicodeCMap(Parse(Error))` on
# real-world PDFs (MS Office + scanners). `pdf-extract` routes
# ToUnicode through `adobe-cmap-parser` and recovers correctly —
# `five_steps_perform_2009.pdf` is the regression pin.
pdf-extract = "0.7"
lopdf = { version = "0.34", default-features = false, features = ["pom_parser"] }
mime_guess = "2"
# Trusted-proxy CIDR parser (security plan #5).
ipnet = "2"
# Operator CLI: clap derive + humantime power the `auth` / `migrate` /
# `documents` subcommands and the global `--config PATH` flag.
clap = { workspace = true }
humantime = "2"
# OAuth2 PKCE dance (catalogue candidate #2). `reqwest` backend
# so the workspace's `reqwest` connection pool is shared via
# `request_async(&self.http)`; `rustls-tls` matches the rest of
# the workspace.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
nagent-server = { path = ".", features = ["test-util", "all-agents"] }
nagent-db      = { path = "../nagent-db", features = ["test-util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = "0.3"
tokio-tungstenite = "0.24"
# Tests reach raw SQL through `nagent_db::Db::raw_execute` /
# `raw_query_*` / `raw_insert_one_str` (gated on
# `nagent-db/test-util`), so the dev-dep on `sqlx` is gone and
# the integration tests are fully nagent_db-driven.